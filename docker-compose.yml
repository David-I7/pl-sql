name: oracle_db
services:
  oracle:
    container_name: oracle
    image: gvenzl/oracle-free:full
    environment:
      # Parola pentru utilizatorul SYS
      - ORACLE_PASSWORD=parola123
      # Parola si nume pentru utilizator custom
      - APP_USER=david
      - APP_USER_PASSWORD=parola123
    ports:
      - 127.0.0.1:1521:1521
    volumes:
      - oracle_data:/opt/oracle/oradata
      # Volum pentru scripturi de initializare
      #- ./init_proiect:/container-entrypoint-initdb.d

volumes:
  oracle_data:
